<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clasificador de notas</title>
     <script src="ejercicio1.js"></script>
</head>
<body>
    <h1>Clasificador de Notas </h1>
    <input type="number" id="notaInput" step="0.01" placeholder="Ingrese nota (0-10)">
    <button onclick="
        const nota = Number(document.getElementById('notaInput').value);
        const res = clasificarNota(nota);
        document.getElementById('resultado').textContent = res;
    ">Clasificar</button>
    <p id="resultado"></p>
</body>
</html>
