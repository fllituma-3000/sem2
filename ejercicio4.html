
<!DOCTYPE html>
<html lang="es">
<head>

    <title>Tarifa de parqueadero</title>

</head>
<body>

    <h1>Tarifa de parqueadero</h1>

    <input type="number" id="minutos" placeholder="Ingrese minutos">

    <button onclick="
        const minutos = Number(document.getElementById('minutos').value);
        const resultado = calcularTarifa(minutos);

        document.getElementById('resultado').textContent =
            'Total a pagar: $' + resultado.toFixed(2);
    ">Calcular tarifa</button>

    <p id="resultado"></p>
