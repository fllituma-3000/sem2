<body>

    <h1>Calculadora</h1>

    <input type="number" id="numero1" placeholder="Primer número">

        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">×</option>
        <option value="/">÷</option>
    </select>

    <input type="number" id="numero2" placeholder="Segundo número">

    <button onclick="
        const a = Number(document.getElementById('numero1').value);
        const b = Number(document.getElementById('numero2').value);
        const operador = document.getElementById('operador').value;

        const resultado = operar(a, b, operador);

        document.getElementById('resultado').textContent = resultado;
    ">Calcular</button>

    <p id="resultado"></p>

</body>
